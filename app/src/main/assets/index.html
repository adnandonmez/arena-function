<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#140B3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fonksiyon Arenası</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#140B3C;--ink:#F6F3FF;--grid:#33288F;--line:#7B61FF;--me:#19F5B4;--rv:#FF4D8D;--accent:#FFD93D;--panel:#1F1561;--void:#0D0728;--muted:#B3A7FF;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 520px at 10% -10%,#4B22C455,transparent),radial-gradient(800px 520px at 100% 0,#FF4D8D33,transparent),var(--paper);background-attachment:fixed;-webkit-tap-highlight-color:transparent;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;line-height:1.4}
h1{margin:0;font-size:1.5rem;font-weight:600;background:linear-gradient(90deg,var(--me),var(--accent),var(--rv));-webkit-background-clip:text;background-clip:text;color:transparent}
#score{color:var(--accent);font-size:.95rem;font-weight:600}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
canvas{display:block;width:100%;height:auto;border-radius:8px}
#msg{min-height:2.6em;margin:10px 2px 8px;font-size:1.05rem}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#go{background:var(--accent);color:#1b1140;border-color:var(--accent);font-weight:600;font-size:1.05rem;padding:10px 22px;box-shadow:0 0 18px #FFD93D77}
#rst{border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button{flex:1;min-width:70px;padding:7px 4px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#1b1140;border-color:var(--accent)}
#formula,#rformula{white-space:pre-line}
#formula{font-weight:600;margin:10px 0 2px;color:var(--me);word-break:break-word}
#rformula{font-size:.9rem;color:var(--rv);margin:0 0 8px;word-break:break-word}
.row[hidden]{display:none}
.sl{display:grid;grid-template-columns:2.6em 1fr 4.2em;gap:8px;align-items:center;margin:6px 0}
.sl output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--me);height:28px}
#hint{font-size:.9rem;color:var(--muted);margin:8px 0}
.key{font-size:.85rem;color:var(--muted);margin-top:6px}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
table{border-collapse:collapse;width:100%;font-size:.85rem;text-align:center;margin-top:8px}
th,td{border:1px solid var(--grid);padding:3px 2px}
th{background:var(--paper);font-weight:600}
#sliders{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 4px}
.vs{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:3.2em}
.vs b{font-size:1.05rem}
.vs output{font-size:.85rem;font-variant-numeric:tabular-nums}
.vs input{touch-action:none;writing-mode:vertical-lr;direction:rtl;height:150px;width:30px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.vs input::-webkit-slider-runnable-track{width:4px;background:var(--line);border-radius:2px}
.vs input::-moz-range-track{width:4px;background:var(--line);border-radius:2px}
.vs input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:16px;border:2px solid var(--line);background:var(--accent);border-radius:5px;margin-left:-10px;box-shadow:0 0 10px #FFD93D88}
.vs input::-moz-range-thumb{width:20px;height:12px;border:2px solid var(--line);background:var(--accent);border-radius:5px}
.gen{font-size:1.15rem;font-weight:600;margin-top:10px;padding:6px 10px;border:2px dashed var(--grid);border-radius:10px;display:inline-block}
.vdiv{border-left:2px dashed var(--grid);align-self:stretch}
.lbl{border:2px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:600}
.tabs button.sm{flex:none;min-width:44px}
#fsel{font:inherit;font-weight:600;flex:1;min-width:140px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
#fsel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{touch-action:manipulation;min-height:42px}
.stage .box{padding:8px}
#snd{min-height:36px;padding:4px 10px;font-size:.9rem}
button:disabled{opacity:.45;cursor:not-allowed}
#code{font:inherit;font-weight:600;width:9em;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-transform:lowercase}
.upg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#1b1140;border-color:var(--accent);font-weight:600}
.toast{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px;margin:8px 0;box-shadow:0 0 16px #FFD93D66;font-size:.95rem}
.toast[hidden]{display:none}
.toast button{margin-top:6px;min-height:34px}
.grp{border:2px solid var(--line);border-radius:14px;padding:6px 8px 8px;background:var(--panel)}
.grp.lock{opacity:.55;border-style:dashed;display:flex;flex-direction:column;justify-content:center;min-width:100px}
.gt{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:4px;font-weight:600}
.grow{display:flex;gap:6px;justify-content:center}
.wcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.wl{font-size:.75rem;color:var(--muted)}
.wheel{position:relative;width:50px;height:96px;border-radius:4px;background:var(--paper);border:2px solid var(--line);overflow:hidden;outline:none}
.wheel.wide{width:100px}.wheel.mid{width:78px}
.wheel:focus-visible{outline:3px solid var(--accent)}
.wsc{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:32px 0;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;
 -webkit-mask-image:linear-gradient(rgba(0,0,0,.25),#000 33%,#000 67%,rgba(0,0,0,.25));mask-image:linear-gradient(rgba(0,0,0,.25),#000 33%,#000 67%,rgba(0,0,0,.25))}
.wsc::-webkit-scrollbar{display:none}
.wit{height:32px;line-height:32px;text-align:center;scroll-snap-align:center;font-weight:600;color:var(--muted);font-size:.92rem;cursor:pointer;white-space:nowrap;user-select:none}
.wit.on{color:var(--ink);font-size:1.08rem}
.wheel::before,.wheel::after{content:'';position:absolute;left:6px;right:6px;height:2px;background:var(--accent);pointer-events:none;z-index:2}
.wheel::before{top:31px}.wheel::after{top:63px}

html,body{height:100%;overflow:hidden;background:var(--void)}
:root{--sl:.9;--sr:.9;--op:.92}
button,summary{border-radius:4px}
#stage{position:fixed;inset:0;background:var(--void)}
#arena{width:100%;height:100%;object-fit:contain;border-radius:0}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding:calc(4px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px)) 0 calc(6px + env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#hud button{min-height:36px;min-width:40px;padding:2px 10px;background:#0D0728CC}
#hmid{max-width:56vw;text-align:center;background:#0D0728B3;border:2px solid var(--line);border-radius:4px;padding:3px 8px;font-size:.76rem;line-height:1.25;pointer-events:none}
#hmid>div{margin:1px 0}#score{color:var(--accent);font-weight:600}#formula{font-size:.8rem;margin:0;font-weight:600}#rformula{font-size:.72rem;margin:0}
#msg{min-height:0;margin:0;font-size:.76rem}#msg:empty{display:none}
#hmid .toast{margin:3px 0 0;padding:4px 6px;font-size:.74rem;pointer-events:auto}
.pnl{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;padding:4px;border:2px solid var(--line);border-radius:4px;background:#0D0728A6;opacity:var(--op);z-index:4}
#pL{left:calc(4px + env(safe-area-inset-left,0px));transform:scale(var(--sl));transform-origin:bottom left}
#pR{right:calc(4px + env(safe-area-inset-right,0px));transform:scale(var(--sr));transform-origin:bottom right}
.grp{border-radius:4px;padding:3px 5px 4px}.grp.lock{min-width:84px}.gt{margin-bottom:2px}
.vs input{height:62px}.vs{gap:2px}.vs b{font-size:.95rem}
#go{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;padding:10px 18px;font-size:1rem;white-space:nowrap}
#aux{display:none}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#140B3CFA,#0D0728FC);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#menu[hidden],[hidden]{display:none!important}
#menu.clear{background:transparent;align-items:flex-start;justify-content:center;pointer-events:none}#menu.clear>*{pointer-events:auto}
.mv{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(340px,92vw);max-height:100%;overflow:auto}
.mt{font-size:1.9rem;font-weight:600;background:linear-gradient(90deg,var(--me),var(--accent),var(--rv));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 2px}
.mb{width:100%;min-height:46px;font-size:1.05rem;font-weight:600;border-width:2px}
.mb.pri{background:var(--accent);color:#1b1140;border-color:var(--accent)}
.card{width:min(520px,92vw);background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:12px;font-size:.95rem}
.card h2{margin:0 0 6px;font-size:1.1rem;color:var(--accent)}.card p{margin:0 0 8px;line-height:1.4}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.dots i{width:9px;height:9px;border-radius:2px;background:var(--grid)}.dots i.on{background:var(--accent)}
.card .row{justify-content:space-between}
#vset,#vtut{width:auto}#vset .card{width:min(500px,86vw);padding:8px 10px}#vset .card h2{margin:0 0 2px}#vset .sl{grid-template-columns:6em 1fr 3em;margin:1px 0}#vset .card p{display:none}

#arena{object-fit:contain}
.pnl{background:none;border:none;box-shadow:none;gap:10px}
.grp{border:none;background:none;padding:0 2px}.grp.lock{border:none;opacity:.45}
.gt,.wl,.vs b,.vs output,.wcol{text-shadow:0 1px 3px #000,0 0 8px #000}
.gt{color:#D9CCFF;letter-spacing:.04em}
.wheel{background:rgba(12,5,44,.34);border:1px solid rgba(183,156,255,.45);border-radius:8px;box-shadow:inset 0 0 14px rgba(123,97,255,.25)}
.wit{color:#CFC2FF;text-shadow:0 1px 3px #000}.wit.on{color:#fff;text-shadow:0 0 10px #B79CFF,0 1px 3px #000}
.wheel::before,.wheel::after{background:rgba(255,217,61,.85);box-shadow:0 0 8px #FFD93D}
.vs input::-webkit-slider-runnable-track{background:rgba(183,156,255,.6);box-shadow:0 0 8px #7B61FF}
#hud button{background:rgba(13,5,44,.38);border:1px solid rgba(183,156,255,.45);backdrop-filter:blur(2px)}
#hmid{background:none;border:none;text-shadow:0 1px 4px #000,0 0 10px #000}
#hmid .toast{background:rgba(13,5,44,.6);border:1px solid var(--accent)}
#go{background:linear-gradient(180deg,#FFE680,#FFB300);border:1px solid #fff3b0;color:#2a1450;box-shadow:0 0 22px #FFB30099,inset 0 1px 0 #fff8}
#menu{background:radial-gradient(900px 500px at 50% 0,#4B22C4AA,transparent),linear-gradient(160deg,#0a0328E8,#190a4ae8);backdrop-filter:blur(3px)}
.mt{font-family:Cinzel,Georgia,serif;font-weight:800;letter-spacing:.06em;font-size:2.05rem;filter:drop-shadow(0 0 14px #7B61FF)}
.mb{background:linear-gradient(180deg,#2c1a7a,#1a0e52);border:1px solid #B79CFF;box-shadow:0 0 14px #7B61FF66,inset 0 1px 0 #ffffff22}
.mb.pri{background:linear-gradient(180deg,#FFE680,#FFB300);border-color:#fff3b0;color:#2a1450;box-shadow:0 0 20px #FFB30088}
.card{background:rgba(20,10,66,.82);border:1px solid #B79CFF;box-shadow:0 0 24px #7B61FF55}
#score{white-space:pre-line}</style>
</head>
<body>
<div id="stage"><canvas id="arena" width="800" height="480" aria-label="Oyun alanı"></canvas></div>
<div id="hud">
 <button id="mbtn" aria-label="Menü">☰</button>
 <div id="hmid"><div id="score"></div><div id="formula"></div><div id="rformula"></div><div id="msg" role="status"></div><div id="toast" class="toast" hidden></div></div>
 <button id="snd" aria-label="Sesi aç veya kapat"></button>
</div>
<div id="pL" class="pnl" aria-label="Fonksiyon ve hız"></div>
<div id="pR" class="pnl" aria-label="Öteleme, esneme ve yansıma"></div>
<button id="go">Başlat</button>
<div id="aux"><div id="gen"></div><div id="upg"></div><div id="hint"></div><div id="tbl"></div></div>
<div id="menu">
 <div id="vmain" class="mv">
  <h1 class="mt">Fonksiyon Arenası</h1>
  <button id="mresume" class="mb pri" hidden>▶ Oyuna dön</button>
  <button id="netbtn" class="mb">🌐 Çevrimiçi oyna</button>
  <div class="row" id="netbox" hidden style="width:100%"><input id="code" maxlength="8" aria-label="Oda kodu" placeholder="Oda kodu" autocapitalize="off" autocomplete="off" style="flex:1;width:auto"><button id="netgo">Bağlan</button></div>
  <span id="netmsg" class="key" style="margin:0;text-align:center"></span>
  <button id="msolo" class="mb pri">👤 Tek oyna</button>
  <button id="mtut" class="mb">📖 Eğitim</button>
  <div class="row" style="width:100%"><button id="mset1" class="mb" style="flex:1">⚙ Ayarlar</button><button id="rst" class="mb" style="flex:1" hidden>↺ Seviyeyi sıfırla</button></div>
 </div>
 <div id="vset" class="mv" hidden>
  <div class="card"><h2>Kontrol boyutları</h2>
   <div class="sl"><span>Sol panel</span><input type="range" id="sL" min=".6" max="1.4" step=".05" value=".9"><output id="oL"></output></div>
   <div class="sl"><span>Sağ panel</span><input type="range" id="sR" min=".6" max="1.4" step=".05" value=".9"><output id="oR"></output></div>
   <div class="sl"><span>Müzik</span><input type="range" id="sM" min="0" max="1" step=".05" value=".6"><output id="oM"></output></div>
   <div class="sl"><span>Saydamlık</span><input type="range" id="sO" min=".35" max="1" step=".05" value=".92"><output id="oO"></output></div>
   <p class="key" style="margin:4px 0">Panelleri oyunun üstünde canlı görürsün.</p>
   <button id="mai" class="mb" style="min-height:38px;margin-top:4px"></button>
   <button id="mmode" class="mb" style="min-height:38px;margin-top:4px"></button>
   <button id="mreset" class="mb" style="min-height:38px;margin-top:4px">🔄 Yeni oyun (ilerlemeyi sıfırla)</button>
   <details><summary class="key">Geliştirme ayarları</summary><div class="row" style="margin-top:6px"><button id="tunl">Öğretmen: tümünü aç</button><button id="tres">İlerlemeyi sıfırla</button></div></details>
   <div class="row" style="justify-content:flex-end;margin-top:8px"><button id="mback" class="mb pri" style="width:auto;padding:0 22px">Tamam</button></div>
  </div>
 </div>
 <div id="vtut" class="mv" hidden>
  <div class="card"><h2 id="ttl"></h2><p id="ttx"></p><div class="dots" id="tdots"></div>
   <div class="row"><button id="tprev">‹ Önceki</button><button id="tmenu">Menü</button><button id="tnext" class="mb pri" style="width:auto;padding:0 18px;min-height:40px">Sonraki ›</button></div></div>
 </div>
</div>
<script src="peerjs.min.js"></script>
<script src="net-shim.js"></script>
<script>
const WIN=5,XM=9,YM=5,U=40,OX=400,OY=240,R=16,SZ=32,LIMIT=60;
const PSUP='⁰¹²³⁴⁵',RP=[[-2,1],[-1,4],[-1,3],[-1,2],[1,2],[1,3],[1,4]],LOGS=[{s:'log½',b:.5,n:'½'},{s:'log₂',b:2,n:'2'},{s:'ln',b:Math.E,n:'e'},{s:'log₁₀',b:10,n:'10'}];
const TY={
 pow:{name:'xⁿ',short:'xⁿ',hint:'xⁿ: n = 0 ise f(x) = 1 sabit fonksiyondur. n çift ise grafik y eksenine göre simetriktir (çift fonksiyon), n tek ise orijine göre simetriktir (tek fonksiyon).'},
 rpow:{name:'xʳ',short:'xʳ',hint:'xʳ: r = −2 ise x ≠ 0 için tanımlıdır, eksenler asimptottur. x^(p/q): q çift ise tanım kümesi x ≥ 0 (üs negatifse x > 0), q tek ise x ≠ 0 için tüm gerçek sayılardır.'},
 inv:{name:'1/xⁿ',short:'1/xⁿ',hint:'1/xⁿ: x ≠ 0. n tek ise orijine göre simetriktir, n çift ise y eksenine göre simetriktir. Eksenler asimptottur.'},
 log:{name:'logₐ x',short:'logₐ x',hint:'logₐ x: tanım kümesi x > 0, x = 0 doğrusu dikey asimptottur. Taban 1’den büyükse artan, ½ gibi 0 ile 1 arasındaysa azalan fonksiyondur.'},
 sin:{name:'sin x',short:'sin x',hint:'sin x: periyot 2π, değer kümesi [−1, 1]. Tek fonksiyondur, grafik orijine göre simetriktir.'},
 tan:{name:'tan x',short:'tan x',hint:'tan x: periyot π, x = π/2 + kπ doğruları dikey asimptottur.'}
};
const ORDER=['pow','rpow','inv','log','sin','tan'];
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fold=(v,l)=>{const m=((v+l)%(4*l)+4*l)%(4*l);return m<2*l?m-l:3*l-m};
const fmt=v=>(Math.round(v*100)/100).toFixed(2),fc=v=>v.toFixed(1).replace('.',',').replace('-','−');
const num=v=>String(Math.round(v*100)/100).replace('.',',');
function base(fn,u){
  switch(fn.ty){
    case 'sin':return Math.sin(u);
    case 'log':return u>0?Math.log(u)/Math.log((LOGS[fn.ri]||LOGS[3]).b):NaN;
    case 'inv':return Math.abs(u)<1e-9?NaN:Math.pow(u,-(fn.n||1));
    case 'pow':return Math.pow(u,fn.n);
    case 'tan':return Math.abs(Math.cos(u))<1e-6?NaN:Math.tan(u);
    default:{const[p,q]=RP[fn.ri];if(u>=0)return Math.pow(u,p/q);return q%2?(p%2?-1:1)*Math.pow(-u,p/q):NaN}
  }
}
const val=(fn,x)=>fn.rx*fn.A*base(fn,fn.ry*fn.B*(x-fn.h))+fn.k;
const F=(fn,x)=>{const v=val(fn,x);return isFinite(v)?clamp(v,-1e4,1e4):0};
function formula(fn){
  const A=fn.rx*fn.A,B=fn.ry*fn.B,Aa=Math.abs(A),Ba=Math.abs(B),h=fn.h;
  const inner=h?'(x '+(h>0?'− ':'+ ')+num(Math.abs(h))+')':'x';
  const arg=(B<0?'−':'')+(Ba!==1?num(Ba)+(h?'·':''):'')+inner;
  const pa=(arg==='x'||(B>0&&Ba===1&&h))?arg:'('+arg+')',ks=fn.k?(fn.k>0?' + ':' − ')+num(Math.abs(fn.k)):'';
  if(fn.ty==='inv')return 'y = '+(A<0?'−':'')+num(Aa)+'/'+pa+(fn.n>1?PSUP[fn.n]:'')+ks;
  let b;
  const af=(B>0&&Ba===1&&h)?inner.slice(1,-1):arg;
  if(fn.ty==='sin')b='sin('+af+')';else if(fn.ty==='log')b=(LOGS[fn.ri]||LOGS[3]).s+'('+af+')';else if(fn.ty==='tan')b='tan('+af+')';
  else if(fn.ty==='pow')b=fn.n===1?pa:pa+PSUP[fn.n];else{const r=RP[fn.ri];b=pa+'^('+rlab(r)+')'}
  return 'y = '+(A<0?'−':'')+(Aa!==1?num(Aa)+'·':'')+b+ks;
}
const TRW=[22,23],SGW=[24,25],RFW=[26,27,28];
const UPG=[
 {n:'Öteleme 1: yatay (h)',w:22,d:'Grafiği yatayda h birim kaydırır: y = f(x − h).'},
 {n:'Öteleme 2: dikey (k)',w:23,d:'Grafiği dikeyde k birim de kaydırır: y = f(x − h) + k.'},
 {n:'Esneme 1: dikey (A)',w:24,d:'Grafiği dikeyde A katsayısıyla uzatır veya sıkıştırır: y = A·f(x).'},

}
function aiScore(fr){

function makeWheel(items,idx,onsel,label,cls,after){

  const sc=document.createElement('div');sc.className='wsc';w.appendChild(sc);

  items.forEach((t,i)=>{const it=document.createElement('div');it.className='wit';it.textContent=t;it.setAttribute('role','option');
    it.onclick=()=>{if(moved){moved=false;return}go(i)};sc.appendChild(it)});

  Object.assign(mine,{ty:'pow',n:0,ri:0,h:0,k:0,A:1,B:1,rx:1,ry:1});$('toast').hidden=true;
  fixMine(mine);buildSliders();newRival();resetRound();updateUI();b.textContent='✓ Sıfırlandı: n = 0 ile başlıyorsun';setTimeout(()=>{b.textContent='🔄 Yeni oyun (ilerlemeyi sıfırla)'},2500)};

function modeLbl(){$('mmode').textContent=STRICT?'📚 Aşama modu: tek seçenek':'📚 Aşama modu: birikmeli'}
modeLbl();
$('mmode').onclick=()=>{SFX.click();STRICT=!STRICT;try{localStorage.setItem('fa_strict',STRICT?'1':'0')}catch(e){}modeLbl();
  fixMine(mine);buildSliders();if(phase!=='run'){newRival();resetRound()}updateUI()};

try{window.__noAI=localStorage.getItem('fa_noai')==='1'}catch(e){}
function aiLbl(){$('mai').textContent=window.__noAI?'🤖 Rakip yapay zekâsı: kapalı':'🤖 Rakip yapay zekâsı: açık'}
aiLbl();$('mai').onclick=()=>{SFX.click();window.__noAI=!window.__noAI;try{localStorage.setItem('fa_noai',window.__noAI?'1':'0')}catch(e){}aiLbl()};
</script>
